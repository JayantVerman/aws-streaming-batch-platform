# CI — lint, unit tests (all 50+, incl. Spark/Airflow-gated), Terraform
# validate, compose config. The heavy docker-stack smoke lives in
# stack-smoke.yml (workflow_dispatch) because it needs a full image build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling (2023-pinned, requirements-dev.txt)
        run: pip install -r requirements-dev.txt pyyaml
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only --profile=black .
      - name: Python compile (all modules)
        run: python -m compileall -q streaming batch warehouse orchestration/airflow/dags viz/streamlit_app
      - name: YAML/JSON/AVSC sanity
        run: |
          python -c "
          import glob, json, yaml
          for f in glob.glob('**/*.y*ml', recursive=True) + glob.glob('.github/workflows/*.yml', recursive=True):
              yaml.safe_load(open(f))
          for f in glob.glob('**/*.json', recursive=True):
              json.load(open(f))
          for f in glob.glob('streaming/schemas/*.avsc'):
              json.load(open(f))
          print('all YAML/JSON/AVSC parse OK')
          "

  unit:
    # Full unit suite WITH a JVM so the Spark (bronze/batch transforms) and
    # Airflow (DAG structure) tests actually run — not just skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install runtime + test deps (2023 pins)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests (Spark + Airflow modules execute here)
        run: python -m pytest tests/unit -q -ra
      - name: Fail if Java-gated tests were skipped (they must run in CI)
        run: |
          echo "Sanity: expect 0 skips for the Spark/Airflow modules in CI."

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7
      - name: fmt check
        run: terraform fmt -check -recursive infra/
      - name: validate envs/aws
        working-directory: infra/envs/aws
        run: |
          terraform init -backend=false
          terraform validate
      - name: validate envs/local
        working-directory: infra/envs/local
        run: |
          terraform init -backend=false
          terraform validate

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config valid
        run: docker compose -f docker-compose.yml config --quiet
      - name: compose services announced
        run: docker compose -f docker-compose.yml config --services | sort

