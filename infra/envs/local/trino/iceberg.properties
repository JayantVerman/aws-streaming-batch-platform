# Trino catalog "iceberg" — the local Athena stand-in (Trino 433).
# Points at the SAME warehouse root the Spark Iceberg catalog uses, so
# everything Spark writes (bronze/silver/gold) is queryable here, e.g.:
#   docker compose exec trino trino --catalog iceberg --schema retail_gold \
#     --execute 'SELECT * FROM daily_sales ORDER BY total_revenue DESC LIMIT 10'
connector.name=iceberg
iceberg.catalog.type=hadoop
iceberg.warehouse=s3a://lake/warehouse/

# MinIO via Trino's native S3 filesystem
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
