# Loki single-binary config (2.9.x, 2023 pin).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2023-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 12h

limits_config:
  retention_period: 168h   # 7 days at demo volume is plenty

compactor:
  working_directory: /loki/compactor
